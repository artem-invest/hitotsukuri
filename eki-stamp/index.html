<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>駅スタンプ帳</title>
<!-- PWA：ホーム画面に追加したときの名前・アイコン・色 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1916" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="駅スタンプ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* 和紙のスタンプ帳。押した駅はインクの色で少し傾いた判子になる */
:root{
  --bg:#f5f0e6; --paper:#fffdf8; --ink-text:#2a2622; --muted:#7b7266; --line:#ddd3c2;
  --accent:#c8432b; --empty:#b9ae9c;
  --f:"Hiragino Mincho ProN","Yu Mincho","YuMincho",serif;
  --g:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1b1916; --paper:#24211d; --ink-text:#ece6da; --muted:#a69d8f; --line:#3a352e;
  --accent:#e2694f; --empty:#5d564c; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink-text);font:15px/1.7 var(--g);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 48px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-family:var(--f);font-weight:800;font-size:1.7rem;letter-spacing:.08em;margin:0}
#summary{font-size:.8rem;color:var(--muted)}
#offline{font-size:.75rem;color:var(--paper);background:var(--muted);border-radius:999px;padding:1px 10px}
.tabs{display:flex;gap:4px;margin:12px 0 4px;border-bottom:1px solid var(--line);
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tabs button{font:inherit;font-weight:700;border:0;background:none;color:var(--muted);padding:8px 12px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink-text);border-bottom-color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px;margin-top:16px}
.stamp{position:relative;aspect-ratio:1;border-radius:50%;background:var(--paper);border:2px dashed var(--empty);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;color:var(--empty);line-height:1.25;text-align:center}
.stamp .nm{font-family:var(--f);font-weight:800;font-size:1rem;overflow-wrap:anywhere}
.stamp small{font-size:.66rem}
.stamp.on{color:var(--ink);border:3px double var(--ink);transform:rotate(var(--tilt));
  box-shadow:inset 0 0 0 4px var(--paper),inset 0 0 0 5px var(--ink)}
.stamp.on .nm{font-size:1.1rem}
.stamp .dt{font-family:ui-monospace,Menlo,monospace;font-weight:700}
.stamp .times{position:absolute;top:-4px;right:-2px;background:var(--ink);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:0 6px}
@media (prefers-reduced-motion:reduce){.stamp.on{transform:none}}
.hint,.muted{color:var(--muted);font-size:.85rem}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:20px;color:var(--muted);text-align:center;margin-top:16px}
.nudge{display:block;width:100%;text-align:left;margin-top:14px;background:var(--paper);border:1.5px solid var(--accent);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.85rem}

.near{margin-top:14px}
.near .big{width:100%;padding:12px;font-size:1.05rem}
.near .big:disabled{opacity:.6}
.warn{color:var(--accent);font-size:.85rem;margin:8px 0 0}
.nearlist{list-style:none;margin:10px 0 0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.nearlist li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.nearlist li:last-child{border-bottom:0}
.nearlist li.in{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.nearlist b{font-family:var(--f);font-size:1.05rem;margin-right:8px}
.nearlist small{display:block;color:var(--muted);font-size:.75rem;line-height:1.4}
.nearlist button{flex:none}
.nearlist button:disabled{background:var(--empty)}
.sugg{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.sugg button{width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.sugg b{margin-right:8px}
.sugg small{color:var(--muted);font-size:.75rem}
.links{display:flex;gap:16px}
.next{margin-top:24px}
.next h2{font-family:var(--f);font-size:1.1rem;margin:0}
.next .muted{margin:0}
.maplink{flex:none;color:var(--accent);font-weight:700;font-size:.85rem}
.add summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted)}
.add[open] summary{margin-bottom:8px}
.linesum{margin:16px 0 4px}
.linesum b{font-family:var(--f);font-size:1.2rem}
details.line{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-top:10px;padding:10px 14px}
details.line summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline}
details.line summary::-webkit-details-marker{display:none}
details.line .ln{font-family:var(--f);font-weight:800;font-size:1.05rem}
details.line .cnt{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--muted)}
details.line .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
details.line .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
details.line.full{border-color:var(--accent)}
details.line.full .cnt{color:var(--accent)}
.dots{list-style:none;margin:12px 0 2px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.dots li{font-size:.8rem;border:1.5px dashed var(--empty);color:var(--muted);border-radius:999px;padding:1px 10px}
.dots li.on{border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-weight:700}
.add{margin-top:24px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.add h2,.card h2{font-size:1rem;margin:0 0 8px;font-family:var(--f)}
.add .row{display:flex;flex-wrap:wrap;gap:8px}
input{font:inherit;font-size:16px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink-text);min-width:0;flex:1 1 8em}
.add button[type=submit],.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button:not(.primary){background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 16px;font-weight:700}

.log{list-style:none;margin:12px 0 0;padding:0}
.log .month{font-family:var(--f);font-weight:800;margin-top:16px;border-bottom:2px solid var(--ink-text)}
.log .row{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.log .d{font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
.log .n{font-weight:700;border-left:4px solid var(--ink);padding-left:8px}
.log .w{font-size:.75rem;color:var(--muted)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:16px}
.card p{margin:6px 0}
.facts{margin:0;padding-left:1.2em}

dialog#sheet{border:0;padding:0;background:transparent;width:100%;max-width:560px;margin:auto auto 0;max-height:85vh}
dialog#sheet::backdrop{background:rgba(0,0,0,.4)}
.sheet{background:var(--paper);color:var(--ink-text);border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet header{display:flex;justify-content:space-between;align-items:center}
.sheet h2{font-family:var(--f);font-size:1.5rem;margin:0}
.sheet .close{border:0;background:none;font-size:1.6rem;line-height:1;padding:4px 8px;color:var(--muted)}
.sheet .big{width:100%;padding:12px;font-size:1.05rem;margin:8px 0 4px}
.visits{list-style:none;padding:0;margin:8px 0}
.visits li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.small{border:1px solid var(--line);background:none;border-radius:6px;padding:2px 10px;font-size:.8rem;color:var(--muted)}
.sheet a{color:var(--accent);font-weight:700}
.sheet .foot{margin-top:14px;text-align:right}
.danger{border:0;background:none;color:var(--accent);font-size:.85rem;text-decoration:underline}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink-text);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:10;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>駅スタンプ帳</h1>
    <span id="offline" hidden>オフライン</span>
    <span id="summary"></span>
  </header>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="stamps" aria-selected="true">スタンプ</button>
    <button type="button" role="tab" data-tab="lines" aria-selected="false">路線</button>
    <button type="button" role="tab" data-tab="log" aria-selected="false">記録</button>
    <button type="button" role="tab" data-tab="backup" aria-selected="false">バックアップ</button>
  </nav>
  <main id="main"><p class="empty">読み込んでいます…</p></main>
</div>
<dialog id="sheet"></dialog>
<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
