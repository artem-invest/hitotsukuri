<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>旬の魚図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 魚屋の値札と藍の暖簾。月ボタン→魚カード（柵の選び方／食べ方）を縦に積む1カラム */
:root{
  --bg:#eef2f4;        /* 氷を敷いたショーケース */
  --paper:#ffffff;
  --ink:#1b2a36;       /* 藍 */
  --sub:#5a6b78;
  --line:#d3dce2;
  --aka:#b3263a;       /* 赤身 */
  --aka-soft:#f7e3e6;
  --ai:#24476b;        /* 暖簾の藍 */
  --ai-ink:#ffffff;
  --f-disp:"Zen Old Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10181f;--paper:#18232c;--ink:#e6edf2;--sub:#9aabb8;--line:#2b3a46;
  --aka:#ec6b7c;--aka-soft:#3a1f26;--ai:#8fb4dc;--ai-ink:#0e1820;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10181f;--paper:#18232c;--ink:#e6edf2;--sub:#9aabb8;--line:#2b3a46;
  --aka:#ec6b7c;--aka-soft:#3a1f26;--ai:#8fb4dc;--ai-ink:#0e1820;color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-disp);font-weight:900;font-size:1.9rem;letter-spacing:.06em;margin:0;line-height:1.2}
.count{font-size:.8rem;color:var(--sub);letter-spacing:.08em}

.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months button{
  font:inherit;font-family:var(--f-disp);font-weight:600;font-size:1rem;
  padding:10px 0;border:1px solid var(--line);border-radius:6px;
  background:var(--paper);color:var(--ink);cursor:pointer;position:relative;
  font-variant-numeric:tabular-nums}
.months button small{font-size:.65em;margin-left:1px}
.months button.has::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--aka)}
.months button[aria-pressed="true"]{background:var(--ai);color:var(--ai-ink);border-color:var(--ai)}
.months button[aria-pressed="true"].has::after{background:var(--ai-ink)}
.months button:focus-visible{outline:2px solid var(--aka);outline-offset:2px}

.monthhead{font-family:var(--f-disp);font-weight:600;font-size:1.15rem;margin:0;display:flex;align-items:center;gap:10px}
.monthhead::after{content:"";flex:1;height:1px;background:var(--line)}

.list{display:flex;flex-direction:column;gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.card-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 18px 12px;border-bottom:1px dashed var(--line)}
.name{font-family:var(--f-disp);font-weight:900;font-size:1.6rem;line-height:1.1;margin:0}
.kana{display:block;font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--sub);letter-spacing:.14em;margin-bottom:4px}
.tag{flex:none;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:var(--aka);background:var(--aka-soft);padding:3px 9px;border-radius:999px}
.bar{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;padding:10px 18px 0}
.bar span{height:6px;border-radius:2px;background:var(--line)}
.bar span.on{background:var(--aka)}
.bar span.now{outline:2px solid var(--ai);outline-offset:1px}
.barlabel{display:flex;justify-content:space-between;font-size:.65rem;color:var(--sub);padding:2px 18px 0;font-variant-numeric:tabular-nums}
.sec{padding:12px 18px 0}
.sec:last-child{padding-bottom:16px}
.sec h3{font-size:.75rem;letter-spacing:.14em;color:var(--sub);margin:0 0 4px;font-weight:700}
.sec ul{margin:0;padding-left:1.1em}
.sec li{margin:2px 0}
.memo{font-size:.85rem;color:var(--sub);background:var(--bg);margin:12px 18px 16px;padding:8px 12px;border-radius:6px}

.empty{border:1px dashed var(--line);border-radius:10px;padding:22px 18px;text-align:center;color:var(--sub);font-size:.9rem}
.empty b{display:block;font-family:var(--f-disp);color:var(--ink);font-size:1.05rem;margin-bottom:4px}
footer{font-size:.75rem;color:var(--sub);text-align:center}
</style>

<div class="wrap">
  <header>
    <h1>旬の魚図鑑</h1>
    <span class="count" id="count"></span>
  </header>

  <nav class="months" id="months" aria-label="月を選ぶ"></nav>

  <h2 class="monthhead" id="monthhead"></h2>
  <div class="list" id="list"></div>

  <footer>刺身は購入当日に。柵は冷蔵庫のチルドで保管</footer>
</div>

<script>
/* ===== 図鑑データ：毎週日曜、ここに1行（1魚）足す =====
   name:名前 / kana:よみ / months:旬の月 / tag:旬の呼び名
   saku:柵の選び方 / eat:刺身で旨い食べ方 / memo:ひとこと         */
const FISH = [
  { name:"戻りガツオ", kana:"もどりがつお", months:[9,10,11], tag:"秋の脂",
    saku:["血合いが鮮やかな赤紫。黒ずみ・茶色は避ける","切り口に虹色のギラつきが出ていないもの（時間が経ったサイン）","パックの底にドリップ（赤い汁）が溜まっていない","脂狙いなら腹側（ハラモ寄り）、さっぱりなら背側"],
    eat:["1cm弱の厚切りで。薄いと脂の旨みが立たない","にんにくスライス＋醤油、または生姜醤油","塩＋オリーブ油＋すだちでカルパッチョ風も合う","たたきにするなら皮目だけ強火で炙り、氷水に浸けず冷蔵で冷ます"],
    memo:"春の初ガツオ（4〜5月）はさっぱり、秋の戻りは脂がのってトロに近い。" },
];

const now = new Date().getMonth()+1;
let cur = now;
try{ const s=+localStorage.getItem("shun-month"); if(s>=1&&s<=12) cur=s; }catch(e){}

const $m=document.getElementById("months"), $l=document.getElementById("list"), $h=document.getElementById("monthhead");
document.getElementById("count").textContent = `収録 ${FISH.length}種`;

for(let i=1;i<=12;i++){
  const b=document.createElement("button");
  b.id="m"+i; b.innerHTML=`${i}<small>月</small>`;
  if(FISH.some(f=>f.months.includes(i))) b.classList.add("has");
  b.onclick=()=>{cur=i;try{localStorage.setItem("shun-month",i)}catch(e){};render()};
  $m.appendChild(b);
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const li=a=>a.map(x=>`<li>${esc(x)}</li>`).join("");

function render(){
  [...$m.children].forEach((b,i)=>b.setAttribute("aria-pressed",i+1===cur));
  $h.textContent = `${cur}月の旬` + (cur===now?"（今月）":"");
  const hits=FISH.filter(f=>f.months.includes(cur));
  if(!hits.length){
    $l.innerHTML=`<div class="empty"><b>${cur}月はまだ空き</b>この月が旬の魚を見つけたら、FISHに1行足そう</div>`;
    return;
  }
  $l.innerHTML=hits.map(f=>`
    <article class="card">
      <div class="card-top">
        <h2 class="name"><span class="kana">${esc(f.kana)}</span>${esc(f.name)}</h2>
        ${f.tag?`<span class="tag">${esc(f.tag)}</span>`:""}
      </div>
      <div class="bar" aria-label="旬の月：${f.months.join("・")}月">${
        Array.from({length:12},(_,i)=>`<span class="${f.months.includes(i+1)?"on":""} ${i+1===cur?"now":""}"></span>`).join("")}</div>
      <div class="barlabel"><span>1月</span><span>6月</span><span>12月</span></div>
      <section class="sec"><h3>柵の選び方</h3><ul>${li(f.saku)}</ul></section>
      <section class="sec"><h3>刺身で旨い食べ方</h3><ul>${li(f.eat)}</ul></section>
      ${f.memo?`<p class="memo">${esc(f.memo)}</p>`:""}
    </article>`).join("");
}
render();
</script>

</body></html>
