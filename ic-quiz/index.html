<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>高速道路IC当てクイズ</title>
<style>
  :root {
    --bg: #f3f5f8; --card: #ffffff; --ink: #1c2533; --sub: #6b7787; --line: #d5dbe4;
    --green: #0b8a4b; --green-soft: #e3f4ea;
    --blue: #2563eb;
    --red: #d23a3a; --red-soft: #fbe6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161d; --card: #1a212b; --ink: #e8edf4; --sub: #93a0b2; --line: #2d3746;
      --green: #2fb36d; --green-soft: #153326; --blue: #5b9cff; --red: #ef6060; --red-soft: #3a1d1d; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161d; --card: #1a212b; --ink: #e8edf4; --sub: #93a0b2; --line: #2d3746;
    --green: #2fb36d; --green-soft: #153326; --blue: #5b9cff; --red: #ef6060; --red-soft: #3a1d1d; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    min-height: 100vh; display: flex; justify-content: center; padding: 16px;
  }
  .app { width: 100%; max-width: 820px; }
  h1 { font-size: 20px; margin: 4px 0 14px; letter-spacing: .02em; }
  h2 { font-size: 14px; margin: 16px 0 8px; color: var(--sub); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .hidden { display: none !important; }

  /* --- 開始画面 --- */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 14px; font-size: 14px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
  }
  .chip[aria-pressed="true"] { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 700; }
  .route-list { display: grid; gap: 10px; margin-top: 8px; }
  .route-btn {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    text-align: left; width: 100%; padding: 14px 16px; font-size: 16px;
    background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; cursor: pointer;
  }
  .route-btn:hover { border-color: var(--green); }
  .route-btn .dh { display: inline-block; text-align: left; margin-top: 2px; }
  .route-btn small { color: var(--sub); font-size: 12px; text-align: right; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--sub); margin-top: 10px; align-items: center; }
  .legend i { display: inline-block; vertical-align: middle; margin-right: 4px; background: var(--green); }
  .lg-ic { width: 14px; height: 14px; border-radius: 50%; }
  .lg-jct { width: 14px; height: 14px; border-radius: 3px; background: var(--blue) !important; }
  .lg-sic { width: 10px; height: 10px; border-radius: 50%; background: transparent !important; border: 3px solid var(--green); }
  .note { font-size: 12px; color: var(--sub); line-height: 1.7; margin-top: 12px; }

  /* --- ルート図 --- */
  .status { display: flex; justify-content: space-between; font-size: 14px; color: var(--sub); margin-bottom: 8px; gap: 8px; }
  .status b { color: var(--ink); }
  .route-wrap { position: relative; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding-top: 4px; }
  .route-wrap::-webkit-scrollbar { display: none; }
  .track { position: relative; display: flex; width: max-content; padding-bottom: 6px; }
  .node { width: var(--node-w, 112px); flex: none; position: relative; text-align: center; padding-top: 38px; }
  .node::before { content: ""; position: absolute; top: 14px; left: 0; right: 0; height: 8px; background: var(--line); }
  .node.done::before { background: var(--green); }
  .node:first-child::before { left: 50%; }
  .node:last-child::before { right: 50%; }
  .mk {
    position: absolute; left: 50%; top: 18px; transform: translate(-50%, -50%); z-index: 1;
    background: var(--card); border: 4px solid var(--line);
  }
  .s3 .mk { width: 28px; height: 28px; }
  .s2 .mk { width: 20px; height: 20px; }
  .s1 .mk { width: 14px; height: 14px; border-width: 3px; }
  .ic .mk, .sic .mk { border-radius: 50%; }
  .jct .mk { border-radius: 6px; }
  .done .mk { background: var(--green); border-color: var(--green); }
  .jct.done .mk { background: var(--blue); border-color: var(--blue); }
  .sic.done .mk { background: var(--card); }
  .current .mk { border-color: var(--green); box-shadow: 0 0 0 4px var(--green-soft); }
  .jct.current .mk { border-color: var(--blue); }
  .label { display: inline-block; font-size: 12.5px; line-height: 1.35; padding: 3px 6px; border-radius: 6px; color: var(--sub); max-width: 100%; }
  .node.done .label { color: #fff; background: var(--green); font-weight: 600; }
  .node.jct.done .label { background: var(--blue); }
  .node.current .label { color: var(--green); font-weight: 700; border: 2px dashed var(--green); }
  .node.jct.current .label { color: var(--blue); border-color: var(--blue); }
  .car {
    position: absolute; top: 3px; left: 0; font-size: 30px; line-height: 1; z-index: 3; pointer-events: none;
    transition: transform .9s cubic-bezier(.45,.05,.25,1); will-change: transform;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,.25));
  }
  .car span { display: inline-block; transform: scaleX(-1); }
  .car.bump { animation: bump .35s; }
  @keyframes bump { 0%,100% { translate: 0 0; } 50% { translate: 0 -8px; } }

  /* --- 地図 --- */
  .dir-chips { margin: 0 0 10px; }
  .dir-chips .chip { padding: 5px 12px; font-size: 13px; }
  .car-ico { font-size: 26px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.4)); }
  .car-ico span { display: inline-block; }

  /* --- 問題 --- */
  .q { font-size: 17px; margin: 0 0 14px; line-height: 1.6; }
  .q .prev { font-weight: 700; color: var(--green); }
  .q .prev.jct { color: var(--blue); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 480px) { .choices { grid-template-columns: 1fr; } }
  .choice {
    display: flex; align-items: center; gap: 10px; padding: 14px; font-size: 16px; text-align: left;
    background: var(--card); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .choice:hover:not(:disabled) { border-color: var(--green); }
  .choice:active:not(:disabled) { transform: scale(.98); }
  .choice .no { width: 24px; height: 24px; border-radius: 50%; flex: none; font-size: 13px; display: grid; place-items: center; background: var(--bg); color: var(--sub); }
  .choice.correct { background: var(--green-soft); border-color: var(--green); }
  .choice.wrong { background: var(--red-soft); border-color: var(--red); animation: shake .3s; }
  .choice:disabled { cursor: default; }
  @keyframes shake { 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
  .msg { min-height: 1.6em; margin: 12px 0 0; font-size: 14px; color: var(--sub); }

  /* --- 学習クイズ --- */
  .q2head { font-size: 14px; color: var(--sub); margin: 0 0 8px; line-height: 1.7; }
  .q2head b { color: var(--ink); }
  .choice.keep { opacity: .55; }
  .miss-item { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }

  /* --- 地点メモ --- */
  .info { margin-top: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-size: 14px; line-height: 1.7; }
  .info .nm { font-weight: 700; margin-bottom: 2px; }
  .info .nm.jct { color: var(--blue); } .info .nm.ic { color: var(--green); }
  .info dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .info dt { color: var(--sub); white-space: nowrap; }
  .info dd { margin: 0; min-width: 0; }
  .info .none { color: var(--sub); }
  .memo { margin-top: 14px; font-size: 14px; }
  .memo summary { cursor: pointer; font-weight: 600; }
  .memo .info { margin-top: 8px; }

  /* --- 結果 --- */
  .score { font-size: 42px; font-weight: 800; color: var(--green); margin: 6px 0; }
  .missed { margin: 10px 0 0; font-size: 14px; line-height: 1.8; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn { padding: 12px 18px; font-size: 15px; border-radius: 10px; cursor: pointer; border: 2px solid var(--green); background: var(--green); color: #fff; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--green); }
</style>
<div class="app">
  <h1>🛣️ IC・JCTの順番クイズ</h1>

  <!-- 開始画面 -->
  <section id="start" class="card">
    <h2 style="margin-top:0">クイズの種類</h2>
    <div class="chips" id="modeChips"></div>

    <div id="studyPanel" class="hidden">
      <div class="note" id="studyDesc" style="margin-top:12px"></div>
      <div class="btns"><button class="btn" id="studyStart">スタート</button></div>
    </div>

    <div id="orderPanel">
    <h2>ジャンル</h2>
    <div class="chips" id="groupChips"></div>

    <h2>走行方向(クイズの中でも切り替えられます)</h2>
    <div class="chips" id="dirPrefChips"></div>

    <h2>出題範囲(規模)</h2>
    <div class="chips" id="sizeChips"></div>
    <div class="note" id="sizeNote"></div>

    <h2>路線を選んでスタート</h2>
    <div id="routeList" class="route-list"></div>

    <div class="legend">
      <span><i class="lg-ic"></i>IC・出入口</span>
      <span><i class="lg-jct"></i>JCT</span>
      <span><i class="lg-sic"></i>スマートIC</span>
      <span>丸の大きさ = 規模(大・中・小)</span>
    </div>
    <div class="note">
      ※ 首都高は主要全路線を収録(一部の短い連絡路・廃止出入口・一方向のみの出入口は除外)。並び順は Wikipedia の各路線記事(交通量表の区間表記)をもとにしています。<br>
      ※ 2022年以降に開通したスマートICや、片方向のみの出入口の一部は含めていません。規模は目安です。<br>
    </div>
    </div>
  </section>

  <!-- 首都高の学習クイズ(経路・逆引き) -->
  <section id="q2" class="card hidden">
    <div class="status"><span id="q2Title"></span><span id="q2Prog"></span></div>
    <div class="q2head" id="q2Head"></div>
    <p class="q" id="q2Q"></p>
    <div class="choices" id="q2Choices"></div>
    <div class="info" id="q2Exp" hidden></div>
    <div class="btns"><button class="btn" id="q2Next" hidden>次へ</button><button class="btn ghost" id="q2Quit">やめる</button></div>
  </section>
  <section id="q2res" class="card hidden">
    <div id="q2ResTitle" style="color:var(--sub)"></div>
    <div class="score" id="q2Score"></div>
    <div class="missed" id="q2Missed"></div>
    <div class="btns">
      <button class="btn" id="q2Retry" hidden>間違えた問題だけ復習</button>
      <button class="btn" id="q2Again">新しい問題でもう一度</button>
      <button class="btn ghost" id="q2Back">メニューへ</button>
    </div>
  </section>

  <!-- クイズ画面 -->
  <section id="play" class="hidden">
    <div class="card">
      <div class="status">
        <span id="routeName"></span>
        <span id="progress"></span>
      </div>
      <div class="chips dir-chips" id="dirChips" aria-label="走行方向"></div>
      <div class="route-wrap" id="routeWrap">
        <div class="track" id="track">
          <div class="car" id="car"><span>🚗</span></div>
        </div>
      </div>
    </div>
    <div class="card">
      <p class="q" id="question"></p>
      <div class="info" style="margin:0 0 14px" id="infoCard" hidden></div>
      <div class="choices" id="choices"></div>
      <p class="msg" id="msg"></p>
    </div>
  </section>

  <!-- 結果画面 -->
  <section id="result" class="card hidden">
    <div id="resultRoute" style="color:var(--sub)"></div>
    <div class="score" id="scoreText"></div>
    <div id="scoreDetail"></div>
    <div class="missed" id="missedList"></div>
    <details class="memo" id="memoBox"><summary>通った地点のメモ(乗り換え・見どころ・SA/PA)</summary><div id="memoList"></div></details>
    <div class="btns">
      <button class="btn" id="retryBtn">もう一度</button>
      <button class="btn ghost" id="backBtn">路線選択へ</button>
    </div>
  </section>
</div>

  return str.split(",").map((tok, fi) => {
    const k = tok.lastIndexOf(":");
    const label = tok.slice(0, k), code = tok.slice(k + 1);
    const t = code[0], size = parseInt(code[1], 10);
    const name = label + SUFFIX[t];
    const kind = t === "X" ? (name.includes("JCT") && !name.includes("IC") ? "jct" : (name.includes("JCT") ? "jct" : "ic")) : KIND[t];
    return { name, kind, size, fi, ll: geo[fi] || null };

}

/* 走行方向ごとの路線を作る。向き0=データの順、向き1=逆。環状線(loop)は起点を固定して回る向きだけを逆にする */
function makeVariant(r, d) {
  if (!r.variants) r.variants = [];
  if (r.variants[d]) return r.variants[d];
  let src = r.list;
  if (d === 1) src = r.loop ? [r.list[0], ...r.list.slice(1).reverse()] : r.list.slice().reverse();
  const list = src.map((n, fi) => ({ ...n, fi }));
  const v = { group: r.group, name: r.name, dirs: r.dirs, list, prefs: null, dirIdx: d,
    dirLabel: `${r.dirs[d]}(${list[0].name}→${list[list.length - 1].name})` };
  return (r.variants[d] = v);
}

/* 選択肢づくり: 種別(JCT/IC/スマートIC)が名前でバレないよう、同じ種別から優先して選ぶ。
   画面にすでに出ている区間は候補から外し、これから先の地点・他路線から選ぶ。 */
function makeOptions(answerIdx) {
  const ans = nodes[answerIdx];
  const shown = new Set(nodes.slice(0, answerIdx).map(n => n.name));
  shown.add(ans.name);
  const sameGroup = ROUTES.filter(r => r.group === route.group);
  const later = nodes.slice(answerIdx + 1);
  const other = sameGroup.filter(r => r !== route).flatMap(r => r.list);
  const tiers = [
    later.filter(n => n.kind === ans.kind),
    other.filter(n => n.kind === ans.kind),
    later,
    other
  ];
  const picked = [], used = new Set(shown);
  for (const tier of tiers) {
    for (const n of shuffle(tier)) {
      if (picked.length >= 3) break;
      if (used.has(n.name)) continue;
      used.add(n.name); picked.push(n);
    }
    if (picked.length >= 3) break;
  }
  return shuffle([ans, ...picked]);
}

function judge(btn, answer) {

  if (btn.dataset.name === answer) {
    locked = true; btn.classList.add("correct");
    [...$("choices").children].forEach(b => b.disabled = true);
    if (!missedThis) firstTry++;
    $("msg").textContent = missedThis ? "正解！" : "正解！ナイス 👏";
    pos++; updateNodes(); placeCar(true); mapAdvance();
    const car = $("car"); car.classList.remove("bump"); void car.offsetWidth; car.classList.add("bump");
    setTimeout(() => { if (pos >= nodes.length - 1) finish(); else askQuestion(); }, 1100);
  } else {

    if (!missedThis) missedNames.push(answer);

}

function uniqueExits() {

function genRoute() {
  const jcts = Object.keys(C1.km);
  for (let t = 0; t < 200; t++) {
    const A = pick(RADIAL), B = pick(RADIAL);
    if (A === B) continue;
    const outer = ((C1.km[B.jct] - C1.km[A.jct]) % C1.L + C1.L) % C1.L, inner = C1.L - outer;
    const same = A.jct === B.jct;
    if (!same && Math.abs(outer - inner) < 3) continue;
    const ea = radialExits(A.r), eb = radialExits(B.r); if (!ea.length || !eb.length) continue;
    const a = pick(ea), b = pick(eb), dir = outer < inner ? "外回り" : "内回り";
    const head = `<b>${a}</b>(${A.r}) から <b>${b}</b>(${B.r}) へ`;
    const summary = same
      ? `${a} →(${A.r} 上り)→ ${A.jct} で乗り換え →(${B.r} 下り)→ ${b}(都心環状線には入りません)`
      : `${a} →(${A.r} 上り)→ ${A.jct} →(都心環状線 ${dir})→ ${B.jct} →(${B.r} 下り)→ ${b}`;
    const steps = [{ head, prompt: same ? `${A.r}と${B.r}は、どのJCTで乗り換えますか?` : `まず、${A.r}から都心環状線に合流するJCTは?`, options: opts4(A.jct, jcts), explain: `${A.r}(${A.area})は ${A.jct} で都心環状線につながります。` + (same ? `${B.r}も同じ ${A.jct} で分かれるので、環状線に入らず乗り換えられます。` : "") }];
    if (!same) {
      steps.push({ head, prompt: `都心環状線は何回りで行くのが近い?`, options: shuffle([{ text: "外回り", ok: dir === "外回り" }, { text: "内回り", ok: dir === "内回り" }]),
        explain: `${A.jct}から${B.jct}へは ${dir} が近い方です。外回りは時計回りで、江戸橋 → 浜崎橋 → 一ノ橋 → 谷町 → 三宅坂 → 竹橋 の順に進みます。` });
      steps.push({ head, prompt: `どのJCTで ${B.r} に分岐しますか?`, options: opts4(B.jct, jcts), explain: `${B.r}(${B.area})は ${B.jct} で分かれます。` });
    }
    steps[steps.length - 1].explain += `<br><b>経路まとめ</b><br>${summary}`;
    return steps;

}

}
function q2Render() {
  const it = q2.items[q2.idx]; q2.answered = false;
  $("q2Prog").textContent = `${q2.idx + 1} / ${q2.items.length}`;
  $("q2Head").innerHTML = it.head || "";
  $("q2Q").textContent = it.prompt;
  const box = $("q2Choices"); box.innerHTML = "";
  (it.shuffled || (it.shuffled = shuffle(it.options))).forEach((o, i) => {
    const b = document.createElement("button"); b.className = "choice"; b.dataset.ok = o.ok ? "1" : "0";
    b.innerHTML = `<span class="no">${i + 1}</span><span>${o.text}</span>`;
    b.onclick = () => q2Answer(b, it); box.appendChild(b);
  });
  $("q2Exp").hidden = true; $("q2Next").hidden = true;
}
function q2Answer(btn, it) {
  if (q2.answered) return; q2.answered = true;
  const good = btn.dataset.ok === "1";
  [...$("q2Choices").children].forEach(b => { b.disabled = true; if (b.dataset.ok === "1") b.classList.add("correct"); });
  if (!good) { btn.classList.add("wrong"); q2.wrong.push(it); } else q2.ok++;
  $("q2Exp").innerHTML = `<b>${good ? "正解!" : "残念…"}</b> ${it.explain}`; $("q2Exp").hidden = false;
  $("q2Next").textContent = q2.idx + 1 >= q2.items.length ? "結果を見る" : "次へ"; $("q2Next").hidden = false;
}
function q2Next() { if (q2.idx + 1 >= q2.items.length) q2Finish(); else { q2.idx++; q2Render(); } }
function q2Finish() {
  $("q2ResTitle").textContent = q2.title;
  $("q2Score").textContent = `${q2.ok} / ${q2.items.length}`;
  $("q2Missed").innerHTML = q2.wrong.length ? "<b>間違えた問題</b>" + q2.wrong.map(w => `<div class="miss-item">${w.head ? w.head + "<br>" : ""}${w.prompt}<br>正解: <b>${w.options.find(o => o.ok).text}</b><br>${w.explain}</div>`).join("") : "ノーミス!";
  $("q2Retry").hidden = !q2.wrong.length;
  show("q2res");
}
$("studyStart").onclick = () => q2Start(mode, q2Build(mode));
$("q2Next").onclick = q2Next;
$("q2Quit").onclick = () => { renderStart(); show("start"); };
$("q2Back").onclick = () => { renderStart(); show("start"); };
$("q2Again").onclick = () => q2Start(q2.mode, q2Build(q2.mode));
$("q2Retry").onclick = () => q2Start(q2.mode, shuffle(q2.wrong).map(w => ({ ...w, shuffled: null })), q2.title + "(復習)");
document.addEventListener("keydown", e => {
  if ($("q2").classList.contains("hidden")) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 4) { const b = $("q2Choices").children[n - 1]; if (b) b.click(); }
  else if (e.key === "Enter" && !$("q2Next").hidden) q2Next();
});

$("retryBtn").onclick = () => startQuiz(curRouteIdx, curDir);
$("backBtn").onclick = () => { renderStart(); show("start"); };

renderStart();
</script>


</body></html>
