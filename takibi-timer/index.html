<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>焚き火タイマー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* layout: 夜の森いっぱいにcanvasの焚き火。左上に大きな残り時間、左下に操作。火は中央やや下。夜景を貫く単一テーマ */
:root {
  --night: #07090e;
  --soot: #14100d;
  --ash: #eadcc6;
  --ember: #e8671f;
  --flame: #ffb347;
  --dim: #a8998a;
  --line: rgba(234, 220, 198, 0.26);
  --font-display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --g: 1;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night);
  color: var(--ash);
  font-family: var(--font-body);
  overflow: hidden;
}
#fire {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: var(--night);
}
.ui {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px calc(env(safe-area-inset-bottom, 0px) + 22px);
  pointer-events: none;
}
.ui > * { pointer-events: auto; }
.top { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.eyebrow {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--dim);
}
.clock {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: clamp(64px, 20vw, 132px);
  line-height: 1;
  letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
  color: var(--ash);
  text-shadow: 0 0 calc(var(--g) * 36px) rgba(255, 140, 50, calc(var(--g) * 0.5));
}
.burn {
  width: min(100%, 320px);
  height: 2px;
  background: var(--line);
  margin-top: 6px;
}
.burn i {
  display: block;
  height: 100%;
  width: 100%;
  background: var(--flame);
  transform-origin: left center;
}
.phase {
  margin: 8px 0 0;
  font-size: 15px;
  line-height: 1.6;
  color: var(--ash);
  text-wrap: balance;
  max-width: 24em;
}
.controls {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  width: min(100%, 420px);
}
.btn {
  font: inherit;
  font-size: 15px;
  font-weight: 500;
  min-height: 48px;
  padding: 10px 14px;
  color: var(--ash);
  background: rgba(10, 8, 7, 0.55);
  border: 1px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
.btn:hover { border-color: var(--flame); }
.btn:focus-visible { outline: 2px solid var(--flame); outline-offset: 2px; }
.btn[aria-pressed="false"] { color: var(--dim); }
.btn.primary {
  grid-column: 1 / -1;
  font-weight: 700;
  font-size: 17px;
  min-height: 54px;
  color: #1a0d06;
  background: var(--ember);
  border-color: var(--ember);
}
.btn.primary:hover { background: var(--flame); border-color: var(--flame); }
[hidden] { display: none !important; }
</style>

<canvas id="fire" role="img" aria-label="夜の森の焚き火。タイマーが進むと炎が小さくなり、熾火になる"></canvas>
<main class="ui">
  <header class="top">
    <p class="eyebrow">焚き火タイマー・10分</p>
    <div class="clock" id="clock" role="timer">10:00</div>
    <div class="burn" aria-hidden="true"><i id="burn"></i></div>
    <p class="phase" id="phase">ぱちぱちと燃える焚き火を、10分間眺めます。</p>
  </header>
  <footer class="controls">
    <button class="btn primary" id="go" type="button">スタート</button>
    <button class="btn" id="reset" type="button">リセット</button>
    <button class="btn" id="snd" type="button" aria-pressed="true">音 オン</button>
    <button class="btn" id="fs" type="button">全画面</button>
  </footer>
</main>

<script>
(function () {
  var cv = document.getElementById('fire');
  var ctx = cv.getContext('2d');
  var TOTAL = 600;
  var reduce = false;
  try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
  var MOTION = reduce ? 0.55 : 1;

  var W = 0, H = 0, dpr = 1, u = 0, s = 1, cx = 0, by = 0, horizon = 0;
  var stars = [], pines = [], trunks = [], canopy = [], specks = [], stones = [], logs = [], sticks = [], coals = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  function rrectOn(g, x, y, w, h, r) {
    g.beginPath();
    if (g.roundRect) g.roundRect(x, y, w, h, r); else g.rect(x, y, w, h);
  }

  /* 薪の質感(樹皮・割り木・炭化)をあらかじめ描いておく */
  function makeTex(len, th, kind, cap) {
    var capW = cap ? th * 0.2 : 0;
    var c = document.createElement('canvas');
    c.width = Math.ceil((len + capW) * dpr); c.height = Math.ceil(th * dpr);
    var g = c.getContext('2d'); g.scale(dpr, dpr);
    var pal = { bark: ['#52392a', '#33231a', '#150d09'], split: ['#dcb77c', '#a2733f', '#3f2814'], char: ['#2c1f17', '#100a07', '#050302'] }[kind];
    var i, n = Math.round(len / 2.5);
    g.save();
    rrectOn(g, 0, 0, len, th, th * 0.3); g.clip();
    var gr = g.createLinearGradient(0, 0, 0, th);
    gr.addColorStop(0, pal[0]); gr.addColorStop(0.45, pal[1]); gr.addColorStop(1, pal[2]);
    g.fillStyle = gr; g.fillRect(0, 0, len, th);
    for (i = 0; i < n; i++) {
      var y = Math.random() * th, x0 = Math.random() * len, l = len * (0.05 + Math.random() * 0.32);
      var dark = Math.random() < 0.7;
      g.strokeStyle = dark ? 'rgba(0,0,0,' + (0.15 + Math.random() * 0.35) + ')' : 'rgba(255,215,160,' + (0.05 + Math.random() * 0.12) + ')';
      g.lineWidth = 0.5 + Math.random() * 1.5;
      g.beginPath(); g.moveTo(x0, y);
      g.quadraticCurveTo(x0 + l / 2, y + (Math.random() - 0.5) * th * 0.12, x0 + l, y + (Math.random() - 0.5) * th * 0.1);
      g.stroke();
    }
    for (i = 0; i < n / 4; i++) {
      g.fillStyle = 'rgba(0,0,0,' + (0.1 + Math.random() * 0.25) + ')';
      g.beginPath(); g.ellipse(Math.random() * len, Math.random() * th, th * (0.05 + Math.random() * 0.2), th * (0.03 + Math.random() * 0.1), 0, 0, 6.283); g.fill();
    }
    if (kind !== 'split') {
      for (i = 0; i < 5; i++) {
        g.fillStyle = 'rgba(4,2,1,' + (0.35 + Math.random() * 0.3) + ')';
        g.beginPath(); g.ellipse(Math.random() * len, Math.random() * th, th * rand(0.2, 0.7), th * rand(0.1, 0.3), 0, 0, 6.283); g.fill();
      }
    } else {
      for (i = 0; i < 4; i++) {
        g.fillStyle = 'rgba(30,15,5,' + (0.25 + Math.random() * 0.25) + ')';
        g.beginPath(); g.ellipse(Math.random() * len, th * rand(0.5, 1), th * rand(0.3, 0.9), th * rand(0.1, 0.25), 0, 0, 6.283); g.fill();
      }
    }
    g.restore();
    if (cap) {
      var ex = len, ey = th / 2, rx = capW, ry = th * 0.5;
      g.fillStyle = kind === 'char' ? '#1b120d' : '#c79d66';
      g.beginPath(); g.ellipse(ex, ey, rx, ry, 0, 0, 6.283); g.fill();
      for (var r = 0.88; r > 0.1; r -= 0.16) {
        g.strokeStyle = 'rgba(80,48,22,' + (0.3 + Math.random() * 0.3) + ')'; g.lineWidth = 0.8;
        g.beginPath(); g.ellipse(ex + rand(-1, 1), ey + rand(-1, 1), rx * r, ry * r, 0, 0, 6.283); g.stroke();
      }
      g.strokeStyle = 'rgba(28,16,9,0.85)'; g.lineWidth = 1.6;
      g.beginPath(); g.ellipse(ex, ey, rx, ry, 0, 0, 6.283); g.stroke();
    }
    return c;
  }
  function mkLog(px, py, lr, tr, ang, kind, cap, layer) {
    var len = lr * u, th = tr * u;
    var o = { x: cx + px * u, y: by + py * u, len: len, th: th, ang: ang, layer: layer, tex: makeTex(len, th, kind, cap), seed: Math.random() * 10, cracks: [] };
    for (var k = 0; k < 9; k++) o.cracks.push({ x: rand(0.06, 0.94) * len, y: rand(0.25, 0.75) * th, l: th * rand(0.25, 0.6), a: rand(-0.9, 0.9), ph: Math.random() * 10 });
    return o;
  }

  function resize() {
    var i;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    u = Math.min(W * 0.92, H * 0.6);
    s = u / 420;
    cx = W / 2; by = H * 0.74; horizon = H * 0.56;
    stars = [];
    for (i = 0; i < 70; i++) stars.push({ x: Math.random() * W, y: Math.random() * horizon * 0.9, r: rand(0.5, 1.3), ph: Math.random() * 10 });
    /* 遠くの杉林 */
    pines = [];
    var n = Math.max(14, Math.round(W / 34));
    for (i = 0; i < n; i++) pines.push({ x: (i + rand(-0.35, 0.35)) / (n - 1) * (W + 80) - 40, h: rand(0.12, 0.26) * H * (0.75 + 0.5 * Math.pow(Math.sin(i * 1.7), 2)), w: rand(0.5, 0.85), tiers: 5 + (Math.random() * 3 | 0) });
    /* 近くの立ち木(幹)と、上を覆う枝葉 */
    trunks = [];
    var nt = W < 600 ? 5 : 9, sc = Math.max(0.8, Math.min(W, H) / 450);
    for (i = 0; i < nt; i++) {
      var depth = rand(0.45, 1), grain = [];
      for (var k = 0; k < 10; k++) grain.push({ f: Math.random(), a: Math.random() });
      trunks.push({ x: (i + 0.5 + rand(-0.3, 0.3)) / nt * W, w: rand(11, 22) * (0.6 + 0.6 * depth) * sc, depth: depth, lean: rand(-0.02, 0.02), grain: grain });
    }
    canopy = [];
    for (i = 0; i < 16; i++) canopy.push({ x: rand(-20, W + 20), y: rand(-30, H * 0.09), rx: rand(40, 120), ry: rand(22, 58) });
    /* 地面の枯れ葉・小石 */
    specks = [];
    for (i = 0; i < 160; i++) specks.push({ x: rand(0, W), y: rand(horizon + 8, H), r: rand(0.7, 2) });
    stones = [];
    for (i = 0; i < 11; i++) {
      var ang = i / 11 * 6.283 + rand(-0.15, 0.15), rx = u * rand(0.03, 0.055);
      stones.push({ x: cx + Math.cos(ang) * u * rand(0.44, 0.5), y: by + u * 0.05 + Math.sin(ang) * u * 0.1, rx: rx, ry: rx * rand(0.55, 0.7), back: Math.sin(ang) < -0.05 });
    }
    /* 薪の山 */
    logs = [
      mkLog(-0.02, -0.035, 0.40, 0.07, 0.03, 'char', false, 'back'),
      mkLog(0.07, -0.015, 0.34, 0.06, 0.45, 'bark', false, 'back'),
      mkLog(-0.17, 0.0, 0.5, 0.045, -0.62, 'split', false, 'front'),
      mkLog(0.15, 0.045, 0.40, 0.09, -0.04, 'bark', true, 'front'),
      mkLog(-0.15, 0.058, 0.34, 0.07, 0.1, 'char', false, 'front')
    ];
    sticks = [
      { x: -0.03, y: 0.03, l: 0.2, a: -0.12, t: 0.012 }, { x: 0.0, y: 0.035, l: 0.16, a: 0.18, t: 0.01 },
      { x: 0.04, y: 0.03, l: 0.22, a: 0.1, t: 0.011 }, { x: -0.07, y: 0.04, l: 0.14, a: -0.35, t: 0.01 }, { x: 0.09, y: 0.04, l: 0.13, a: 0.32, t: 0.01 }
    ];
    coals = [];
    for (var q = 0; q < 46; q++) coals.push({ dx: (Math.random() + Math.random() - 1) * 0.3, dy: rand(-0.012, 0.03), r: rand(1.6, 4.2), ph: Math.random() * 10 });
  }

  /* 炎のスプライト(寿命に沿って白→淡い黄→橙→赤→暗赤。写真に合わせて黄色を長めに) */
  var NS = 24, sprites = [];
  var stops = [[0, [255, 252, 232]], [0.2, [255, 232, 140]], [0.45, [255, 175, 58]], [0.72, [232, 100, 24]], [0.9, [125, 38, 12]], [1, [48, 10, 5]]];
  function colOf(st, t) {
    for (var i = 1; i < st.length; i++) {
      if (t <= st[i][0]) {
        var a = st[i - 1], b = st[i], k = (t - a[0]) / (b[0] - a[0]);
        return a[1].map(function (v, j) { return Math.round(v + (b[1][j] - v) * k); });
      }
    }
    return st[st.length - 1][1];
  }
  function makeSprites(st, mid) {
    var arr = [];
    for (var i = 0; i < NS; i++) {
      var c = colOf(st, i / (NS - 1));
      var sc = document.createElement('canvas'); sc.width = sc.height = 64;
      var g2 = sc.getContext('2d');
      var gr = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(' + c + ',1)');
      gr.addColorStop(0.4, 'rgba(' + c + ',' + mid + ')');
      gr.addColorStop(1, 'rgba(' + c + ',0)');
      g2.fillStyle = gr; g2.fillRect(0, 0, 64, 64);
      arr.push(sc);
    }
    return arr;
  }
  sprites = makeSprites(stops, 0.55);
  var sprites2 = makeSprites([[0, [90, 130, 255]], [0.35, [190, 215, 255]], [0.65, [255, 225, 170]], [1, [255, 140, 50]]], 0.5);
  var smokeSpr = document.createElement('canvas'); smokeSpr.width = smokeSpr.height = 64;
  (function () {
    var g4 = smokeSpr.getContext('2d');
    var gs = g4.createRadialGradient(32, 32, 0, 32, 32, 32);
    gs.addColorStop(0, 'rgba(175,150,135,0.5)'); gs.addColorStop(1, 'rgba(175,150,135,0)');
    g4.fillStyle = gs; g4.fillRect(0, 0, 64, 64);
  })();

  /* 状態 */
  var state = 'idle'; // idle / running / paused / done
  var remaining = TOTAL * 1000, endAt = 0;
  var fS = 1, time = 0, last = 0, accF = 0, accS = 0, accB = 0, accM = 0, accW = 0, nextPop = 0, lastSec = -1, lastPhase = '';
  var parts = [], sparks = [], smoke = [];

  function ease(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
  function flameLevel(r) { return r >= 180 ? 1 : (r <= 12 ? 0 : ease((r - 12) / 168)); }

  /* 風と炎の舌(4本それぞれが別のリズムで伸び縮み・傾く) */
  var sway = 0, hgt = 1;
  var tg = [{ x: -0.1, w: 1.0, h: 0.8, lean: 0 }, { x: -0.04, w: 1.3, h: 0.8, lean: 0 }, { x: 0.03, w: 1.3, h: 0.8, lean: 0 }, { x: 0.09, w: 0.9, h: 0.8, lean: 0 }];
  function dyn(now) {
    var k;
    sway = 0.9 * Math.sin(now * 0.0013) + 0.6 * Math.sin(now * 0.0031 + 1.3) + 0.3 * Math.sin(now * 0.0079 + 4.1);
    var surge = Math.max(0, Math.sin(now * 0.00053 + 1) * Math.sin(now * 0.00131 + 2));
    hgt = 1 + 0.2 * Math.sin(now * 0.0021) + 0.14 * Math.sin(now * 0.0047 + 2) + 0.08 * Math.sin(now * 0.0113 + 0.7) + 0.4 * surge * surge;
    for (k = 0; k < tg.length; k++) {
      tg[k].h = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(now * (0.0026 + k * 0.0009) + k * 2.3)) + 0.18 * Math.sin(now * 0.009 + k * 5);
      tg[k].lean = Math.sin(now * (0.0019 + k * 0.0007) + k * 1.9);
    }
  }
  function pickTongue() {
    var r = Math.random() * 4.5, k = 0, acc = tg[0].w;
    while (r > acc && k < tg.length - 1) { k++; acc += tg[k].w; }
    return k;
  }

  /* 粒子 */
  function spawnFlame(f) {
    var k = pickTongue(), tn = tg[k];
    var h = (0.5 + 0.5 * f) * hgt * tn.h;
    var g = Math.random() + Math.random() - 1;
    parts.push({
      x: cx + tn.x * u * (0.5 + 0.5 * f) + g * u * 0.07 * (0.5 + 0.5 * f) * tn.w + sway * s * 0.6,
      y: by - u * 0.012 - Math.random() * u * 0.012,
      vx: (Math.random() - 0.5) * 0.25 * s,
      vy: -(3.2 + Math.random() * 2.0) * s * h,
      age: 0,
      max: (40 + Math.random() * 30) * (0.5 + 0.5 * f) * (0.75 + 0.25 * h),
      size: u * (0.075 + Math.random() * 0.06) * (0.45 + 0.55 * f) * (0.8 + 0.2 * tn.w),
      seed: Math.random() * 100, k: k, cs: (Math.random() * 7 - 5) | 0, b: 0, w: 0, ve: 0
    });
  }
  function spawnBase(f) {
    var g = Math.random() + Math.random() - 1;
    parts.push({
      x: cx + g * u * 0.08 * (0.5 + 0.5 * f) + sway * s * 0.3,
      y: by - u * 0.01 - Math.random() * u * 0.01,
      vx: 0, vy: -(0.8 + Math.random() * 0.8) * s * (0.5 + 0.5 * f),
      age: 0, max: 14 + Math.random() * 10,
      size: u * (0.06 + Math.random() * 0.035) * (0.4 + 0.6 * f),
      seed: Math.random() * 100, k: 1, cs: 0, b: 1, w: 0, ve: 0
    });
  }
  /* 炎の上でひらひらとなびく細い炎のリボン */
  function spawnWisp(f) {
    var k = pickTongue(), tn = tg[k];
    parts.push({
      x: cx + tn.x * u * (0.5 + 0.5 * f) + sway * s * 2,
      y: by - u * (0.1 + 0.22 * f * hgt * tn.h),
      vx: 0, vy: -(1.6 + Math.random() * 1.4) * s * hgt * (0.5 + 0.5 * f),
      age: 0, max: 45 + Math.random() * 25,
      size: u * (0.05 + Math.random() * 0.035) * (0.5 + 0.5 * f),
      seed: Math.random() * 100, k: k, cs: 3, b: 0, w: 1, ve: 0
    });
  }
  function spawnSpark(f, burst) {
    sparks.push({
      x: cx + (Math.random() - 0.5) * u * 0.14 * (0.4 + f),
      y: by - u * 0.05,
      vx: (Math.random() - 0.5) * (burst ? 2.2 : 1.2) * s,
      vy: -(1.6 + Math.random() * (burst ? 3.6 : 2.4)) * s,
      age: 0, max: 70 + Math.random() * 90, seed: Math.random() * 10
    });
  }
  function step(dt) {
    var f = fS;
    accF += 9 * f * dt * MOTION;
    while (accF >= 1) { accF -= 1; if (parts.length < 1000) spawnFlame(f); }
    accB += 1.6 * f * dt * MOTION;
    while (accB >= 1) { accB -= 1; if (parts.length < 1000) spawnBase(f); }
    accW += 0.45 * f * dt * MOTION;
    while (accW >= 1) { accW -= 1; if (parts.length < 1000) spawnWisp(f); }
    accS += (0.16 * f + 0.015) * dt * MOTION;
    while (accS >= 1) { accS -= 1; spawnSpark(f, false); }
    accM += (0.05 + 0.12 * f) * dt * MOTION;
    while (accM >= 1) {
      accM -= 1;
      if (smoke.length < 80) smoke.push({ x: cx + sway * u * 0.03 + rand(-0.04, 0.04) * u, y: by - u * (0.1 + 0.3 * f * hgt), vx: 0, vy: -rand(0.5, 0.9) * s, age: 0, max: rand(130, 210), size: u * rand(0.05, 0.08), seed: Math.random() * 10 });
    }
    var j = 0, i, p;
    for (i = 0; i < parts.length; i++) {
      p = parts[i]; p.age += dt;
      if (p.age >= p.max) continue;
      var t = p.age / p.max;
      p.vy *= Math.pow(0.988, dt);
      var lat = (sway * 0.5 + tg[p.k].lean * 0.5) * s * (0.1 + 1.3 * t) * 0.8 * (p.w ? 2.2 : 1);
      p.ve = p.vx + lat;
      p.x += (p.ve + Math.sin(time * 0.004 + p.seed + p.age * 0.12) * 0.35 * s * (0.4 + t)) * dt + (cx - p.x) * 0.012 * dt;
      p.y += p.vy * dt;
      parts[j++] = p;
    }
    parts.length = j;
    j = 0;
    for (i = 0; i < smoke.length; i++) {
      p = smoke[i]; p.age += dt;

      for (var b = 0; b < burst; b++) spawnSpark(fS, true);
      if (state === 'running') pop();
    }
    if (state === 'running') setRoar(0.5 * (0.1 + 0.9 * fS));

    step(dt);
    render(L, ep);
    ui(false);
    requestAnimationFrame(frame);
  }

  resize();
  for (var w = 0; w < 90; w++) step(1);
  labelGo(); ui(true);
  requestAnimationFrame(frame);
})();
</script>
